<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Pengenal Gambar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>AI Pengenal Gambar</h1>
  <p>Pilih mode lalu arahkan gambar ke AI.</p>

  <div class="buttons">
    <button id="btnCamera">Buka Kamera</button>
    <label class="btn" for="fileInput">Upload Gambar</label>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div id="preview"></div>
  <div id="status">Memuat model...</div>
  <div id="result"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
<script src="script.js"></script>
</body>
</html>
